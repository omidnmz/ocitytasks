<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>شهر OCity</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #f4f1ea);
    --card: var(--tg-theme-secondary-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1d1b18);
    --muted: var(--tg-theme-hint-color, #8a847a);
    --accent: var(--tg-theme-button-color, #2f6fde);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --line: color-mix(in srgb, var(--text) 12%, transparent);
    --danger: #d9534f;
    --ok: #2e9b5f;
    --sky1: #bfdcf5;
    --sky2: #f6e7cf;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-tg]) { --bg: #16181d; --card: #20232a; --text: #ecebe8; --muted: #8d8f96; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Vazirmatn", Tahoma, system-ui, sans-serif; font-size: 15px; }
  body { padding-bottom: 76px; }
  header { padding: 14px 16px 8px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  header h1 { font-size: 18px; margin: 0; flex: 1 1 auto; }
  .pill { background: var(--card); border-radius: 999px; padding: 5px 11px; font-size: 13px;
    border: 1px solid var(--line); white-space: nowrap; }
  main { padding: 0 16px; }
  .view { display: none; } .view.on { display: block; }

  /* the skyline */
  .sky { position: relative; border-radius: 18px; overflow: hidden;
    background: linear-gradient(var(--sky1), var(--sky2)); }
  .night .sky { background: linear-gradient(#1d2b4a, #3b3a5a); }
  .sky svg { display: block; width: 100%; height: auto; }
  .sky g.bld { cursor: pointer; }
  .xp { margin: 0 16px 4px; background: color-mix(in srgb, var(--text) 10%, transparent); border-radius: 99px;
    height: 9px; overflow: hidden; }
  .xp i { display: block; height: 100%; background: linear-gradient(90deg, #f5b942, #f08a3c); border-radius: 99px;
    transition: width .6s ease; }
  .xpl { margin: 0 16px 10px; font-size: 12px; color: var(--muted); }
  .stage { display: flex; gap: 12px; align-items: center; background: var(--card); border-radius: 14px;
    padding: 10px; border: 1px solid var(--line); margin-bottom: 12px; }
  .stage .art { width: 120px; flex: none; border-radius: 10px; overflow: hidden;
    background: linear-gradient(#cfe6f7, #f3ead8); }
  .stage .info { flex: 1; min-width: 0; }
  .stage .lvl { font-weight: 700; }
  .stage .bar { height: 8px; background: color-mix(in srgb, var(--text) 10%, transparent); border-radius: 9px;
    overflow: hidden; margin: 8px 0 6px; }
  .stage .bar i { display: block; height: 100%; background: #4bb06b; border-radius: 9px; }
  .stage .sub { font-size: 12px; color: var(--muted); line-height: 1.6; }
  .legend { color: var(--muted); font-size: 12px; margin: 8px 2px 14px; line-height: 1.7; }

  /* lists */
  h2 { font-size: 15px; margin: 18px 2px 8px; color: var(--muted); font-weight: 600; }
  .card { background: var(--card); border-radius: 14px; padding: 12px; margin-bottom: 10px;
    border: 1px solid var(--line); }
  .card .t { font-weight: 600; line-height: 1.5; }
  .card .meta { color: var(--muted); font-size: 12px; margin-top: 4px; display: flex; gap: 8px; flex-wrap: wrap; }
  .card.late { border-color: color-mix(in srgb, var(--danger) 55%, transparent); }
  .acts { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  button.b { border: 0; border-radius: 10px; padding: 8px 12px; font: inherit; font-size: 14px;
    background: color-mix(in srgb, var(--text) 8%, transparent); color: var(--text); cursor: pointer; }
  button.b.main { background: var(--accent); color: var(--accent-text); }
  button.b.warn { color: var(--danger); }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; }

  /* new task */
  textarea { width: 100%; min-height: 90px; border-radius: 14px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); padding: 12px; font: inherit; resize: vertical; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px;
    padding: 7px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip.on { background: var(--accent); color: var(--accent-text); border-color: transparent; }
  .wide { width: 100%; margin-top: 16px; padding: 13px; font-size: 16px; }

  /* tabs, sheet, toast */
  nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--card);
    border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); }
  nav button { flex: 1; border: 0; background: none; color: var(--muted); font: inherit; font-size: 12px;
    padding: 6px 0; border-radius: 10px; cursor: pointer; }
  nav button b { display: block; font-size: 20px; font-weight: normal; }
  nav button.on { color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; z-index: 5; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 80vh; overflow-y: auto;
    background: var(--bg); border-radius: 20px 20px 0 0; padding: 16px 16px 28px; transform: translateY(100%);
    transition: transform .25s ease; z-index: 6; }
  .sheet.on { transform: none; } .sheet-bg.on { display: block; }
  .sheet h3 { margin: 0 0 12px; font-size: 17px; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: 86px; background: #222; color: #fff;
    padding: 12px 14px; border-radius: 12px; font-size: 14px; opacity: 0; transition: opacity .2s;
    pointer-events: none; z-index: 7; white-space: pre-line; }
  .toast.on { opacity: .95; }
  .err { padding: 40px 20px; text-align: center; color: var(--muted); line-height: 1.8; }
</style>
</head>
<body>
<header>
  <h1>🏙 شهر OCity</h1>
  <span class="pill" id="level">⭐ …</span>
  <span class="pill" id="streak">🔥 …</span>
  <span class="pill" id="buffer" hidden></span>
</header>
<div class="xp"><i id="xp"></i></div>
<div class="xpl" id="xpl"></div>

<main>
  <section class="view on" id="v-city">
    <div class="sky" id="sky"></div>
    <div class="legend">هر ✅ یه طبقه به ساختمونش اضافه می‌کنه. 🏗 جرثقیل یعنی کار باز داره، داربست و 🚧 یعنی کار عقب‌افتاده،
      زمین خالی یعنی هنوز شروع نشده. ⭐ ساختمون‌های اولویت‌دار. روی هر ساختمون بزن تا مرحله و کارهاش رو ببینی.</div>
  </section>

  <section class="view" id="v-today"><div id="today"></div></section>

  <section class="view" id="v-add">
    <h2>چی یادت افتاد؟</h2>
    <textarea id="text" placeholder="مثلاً: فردا ساعت ۶ عصر به مشتری کراکس زنگ بزنم"></textarea>
    <h2>ساختمون</h2>
    <div class="chips" id="b-chips"></div>
    <h2>کی یادت بندازم؟</h2>
    <div class="chips" id="w-chips"></div>
    <button class="b main wide" id="save">ثبت کار</button>
  </section>
</main>

<nav>
  <button data-v="city" class="on"><b>🏙</b>شهر</button>
  <button data-v="today"><b>📌</b>امروز</button>
  <button data-v="add"><b>➕</b>کار جدید</button>
</nav>

<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); document.documentElement.dataset.tg = "1";
  if (tg.colorScheme === "dark") document.body.classList.add("night"); }

const COLORS = { cityhall: "#c9a96e", retail: "#e0745a", media: "#8b6fd6", marketing: "#e2a93b",
  smarto: "#3fa7a0", technician: "#6c9bd2", fitness: "#5fb36a", tradebot: "#7a8a99",
  personal: "#d98bb0", vault: "#b9a24c" };
const WHEN = [["", "خودکار"], ["1h", "یه ساعت دیگه"], ["evening", "عصر ۱۸"], ["tonight", "امشب ۲۱"],
  ["tomorrow", "فردا"], ["week", "این هفته"], ["none", "یادآوری نمی‌خواد"]];
let S = null, pick = { building: "", when: "" };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fa = (n) => String(n).replace(/\d/g, (d) => "۰۱۲۳۴۵۶۷۸۹"[d]);
const floors = (n) => n ? fa(n) + " طبقه" : "زمین خالی";
const bmap = () => Object.fromEntries(S.buildings.map((b) => [b.key, b]));

async function api(path, body) {
  const r = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: { "Content-Type": "application/json", "X-Init-Data": tg ? tg.initData : "" },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (r.status === 403) throw new Error("forbidden");
  if (!r.ok) throw new Error("http " + r.status);
  return r.json();
}

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 2200);
}

async function load() {
  try { S = await api("/api/state"); }
  catch (e) {
    document.querySelector("main").innerHTML = e.message === "forbidden"
      ? '<div class="err">این شهر فقط از داخل ربات شهرداری و برای شهردار باز می‌شه.</div>'
      : '<div class="err">به ربات وصل نشدم. یه بار ببند و دوباره باز کن.</div>';
    return;
  }
  render();
}

function render() {
  $("streak").textContent = "🔥 " + fa(S.streak) + " روز";
  const total = S.buildings.reduce((n, b) => n + b.floors, 0);
  $("level").textContent = "⭐ سطح " + fa(Math.floor(total / LEVEL_EVERY) + 1);
  $("xp").style.width = ((total % LEVEL_EVERY) / LEVEL_EVERY * 100) + "%";
  $("xpl").textContent = `${fa(total)} طبقه ساخته شده، ${fa(LEVEL_EVERY - total % LEVEL_EVERY)} ✅ دیگه تا سطح بعدی شهر`;
  if (S.buffer !== null) { $("buffer").hidden = false; $("buffer").textContent = "🎬 ذخیره محتوا: " + fa(S.buffer); }
  drawCity(); drawToday(); drawChips();
}

const LEVEL_EVERY = 10;
const STAGES = [[0, "زمین خالی"], [1, "پی"], [3, "خونه"], [7, "ساختمون"], [13, "برج"], [25, "آسمان‌خراش"]];
const shade = (hex, k) => { const n = parseInt(hex.slice(1), 16);
  const ch = (v) => Math.max(0, Math.min(255, Math.round(v * k)));
  return `rgb(${ch(n >> 16)},${ch((n >> 8) & 255)},${ch(n & 255)})`; };

function drawCity() {
  // an isometric block: 4 columns, buildings in priority order, parks in the free lots
  const W = 390, w = 46, h = 23, x0 = W / 2, cols = 4;
  const slots = [...S.buildings];
  while (slots.length % cols) slots.push(null);
  if (slots.length < 12) slots.push(null, null, null, null);
  const rows = slots.length / cols;
  const most = Math.max(1, ...S.buildings.map((b) => b.floors));
  const fh = Math.max(3, Math.min(9, 150 / most));
  const top = 30 + Math.min(most, 40) * fh + 40;
  const y0 = top;
  const pt = (c, r) => [x0 + (c - r) * w, y0 + (c + r) * h];
  const H_ = y0 + (cols + rows) * h + 10;
  const tiles = slots.map((b, i) => ({ b, c: i % cols, r: Math.floor(i / cols) }))
    .sort((p, q) => (p.c + p.r) - (q.c + q.r) || p.c - q.c);
  const [ax, ay] = pt(-0.6, -0.6), [bx, by] = pt(cols - 0.4, -0.6), [cx, cy] = pt(cols - 0.4, rows - 0.4), [dx, dy] = pt(-0.6, rows - 0.4);
  let svg = `<polygon points="${ax},${ay} ${bx},${by} ${cx},${cy} ${dx},${dy}" fill="#8f8b84"/>`;
  for (const t of tiles) {
    const [x, y] = pt(t.c, t.r);
    const b = t.b, tw = w * 0.8, th = h * 0.8;
    svg += `<polygon points="${x},${y - h} ${x + w},${y} ${x},${y + h} ${x - w},${y}" fill="${b ? "#cfc6b6" : "#7cbf6a"}" stroke="#ffffff55"/>`;
    if (!b) {
      for (const [ox, oy] of [[-12, -2], [10, 2], [0, 8]])
        svg += `<rect x="${x + ox - 1.5}" y="${y + oy - 10}" width="3" height="10" fill="#6b4a2b"/><circle cx="${x + ox}" cy="${y + oy - 14}" r="8" fill="#3f9a4a"/>`;
      continue;
    }
    let g = "";
    const c = COLORS[b.key] || "#999";
    let labelY = y - 22;
    if (b.floors === 0) {
      g += `<polygon points="${x},${y - th} ${x + tw},${y} ${x},${y + th} ${x - tw},${y}" fill="#a47d55" stroke="#7a5a3a" stroke-dasharray="3 2"/>
        <text x="${x}" y="${y + 5}" font-size="16" text-anchor="middle">🚧</text>`;
    } else {
      const n = Math.min(b.floors, 40), H = 10 + n * fh;
      g += `<polygon points="${x - tw},${y} ${x},${y + th} ${x},${y + th - H} ${x - tw},${y - H}" fill="${shade(c, 0.78)}"/>
        <polygon points="${x},${y + th} ${x + tw},${y} ${x + tw},${y - H} ${x},${y + th - H}" fill="${shade(c, 0.95)}"/>`;
      if (fh >= 6) for (let i = 0; i < n; i++) {
        const yy = y - 10 - i * fh + 2;
        for (const k of [0.25, 0.6]) {
          const lx = x - tw + tw * k, ly = yy + th * k;
          g += `<polygon points="${lx},${ly} ${lx + 7},${ly + 3.5} ${lx + 7},${ly - 1.5} ${lx},${ly - 5}" fill="#fff6c9" opacity=".85"/>`;
          const rx = x + tw * k - 7, ry = yy + th - th * k;
          g += `<polygon points="${rx},${ry} ${rx + 7},${ry - 3.5} ${rx + 7},${ry - 8.5} ${rx},${ry - 5}" fill="#fff6c9" opacity=".7"/>`;
        }
      }
      g += `<polygon points="${x},${y - th - H} ${x + tw},${y - H} ${x},${y + th - H} ${x - tw},${y - H}" fill="${shade(c, 1.15)}"/>`;
      if (b.overdue)
        g += `<polygon points="${x - tw - 3},${y + 2} ${x},${y + th + 3} ${x},${y + th - H + 8} ${x - tw - 3},${y - H + 8}" fill="url(#sc)" opacity=".9"/>`;
      labelY = y - H - th - 10;
      if (b.open && !b.overdue) {
        const mx = x + tw * 0.55, my = y - H + 2;
        g += `<line x1="${mx}" y1="${my}" x2="${mx}" y2="${my - 46}" stroke="#f2b632" stroke-width="3"/>
          <line x1="${mx - 34}" y1="${my - 44}" x2="${mx + 12}" y2="${my - 44}" stroke="#f2b632" stroke-width="3"/>
          <line x1="${mx - 28}" y1="${my - 44}" x2="${mx - 28}" y2="${my - 24}" stroke="#333" stroke-width="1"/>
          <rect x="${mx - 32}" y="${my - 25}" width="8" height="5" fill="#666"/>`;
      }
    }
    if (b.overdue) g += `<text x="${x - tw + 2}" y="${y + th + 12}" font-size="12">🚧</text>`;
    const star = b.priority ? "⭐" : "";
    g += `<g transform="translate(${x},${labelY})"><rect x="-22" y="-12" width="44" height="16" rx="8" fill="#1d1b18cc"/>
      <text x="0" y="0" font-size="10" fill="#fff" text-anchor="middle">${b.emoji}${b.floors ? " " + fa(b.floors) : ""}${star}</text></g>`;
    svg += `<g class="bld" data-b="${b.key}">${g}</g>`;
  }
  $("sky").innerHTML = `<svg viewBox="0 ${Math.max(0, y0 - top)} ${W} ${H_}" xmlns="http://www.w3.org/2000/svg">
    <defs><pattern id="sc" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="2" height="6" fill="#b07d2b"/></pattern></defs>${svg}</svg>`;
  document.querySelectorAll("#sky g.bld").forEach((el) => el.onclick = () => openBuilding(el.dataset.b));
}

function stageOf(n) {
  const i = STAGES.findLastIndex(([m]) => n >= m);
  return { i, name: STAGES[i][1], next: STAGES[i + 1] };
}

function stageArt(b) {
  const c = COLORS[b.key] || "#999", d = shade(c, 0.75), n = b.floors;
  let s = `<rect y="88" width="160" height="20" fill="#9bc27a"/>`;
  if (n === 0) s += `<rect x="40" y="78" width="80" height="12" fill="#a47d55"/><rect x="50" y="62" width="4" height="18" fill="#f28c28"/>
    <rect x="104" y="62" width="4" height="18" fill="#f28c28"/><text x="80" y="62" font-size="20" text-anchor="middle">🚧</text>`;
  else if (n < 3) s += `<rect x="50" y="64" width="60" height="26" fill="${c}"/><rect x="50" y="64" width="60" height="5" fill="${d}"/>
    <line x1="120" y1="90" x2="120" y2="20" stroke="#f2b632" stroke-width="4"/><line x1="70" y1="22" x2="132" y2="22" stroke="#f2b632" stroke-width="4"/>`;
  else if (n < 7) s += `<polygon points="45,55 80,30 115,55" fill="${d}"/><rect x="50" y="55" width="60" height="35" fill="${c}"/>
    <rect x="60" y="62" width="12" height="10" fill="#fff6c9"/><rect x="88" y="62" width="12" height="10" fill="#fff6c9"/><rect x="74" y="74" width="12" height="16" fill="${d}"/>`;
  else if (n < 13) { s += `<rect x="52" y="22" width="56" height="68" fill="${c}"/><rect x="52" y="18" width="56" height="6" fill="${d}"/>`;
    for (let r = 0; r < 5; r++) for (let k = 0; k < 3; k++) s += `<rect x="${58 + k * 17}" y="${28 + r * 12}" width="10" height="7" fill="#fff6c9"/>`; }
  else { s += `<rect x="60" y="6" width="40" height="84" fill="${c}"/><rect x="68" y="0" width="24" height="8" fill="${d}"/>
    <rect x="38" y="44" width="22" height="46" fill="${d}"/><rect x="100" y="54" width="22" height="36" fill="${d}"/>`;
    for (let r = 0; r < 7; r++) for (let k = 0; k < 2; k++) s += `<rect x="${66 + k * 16}" y="${14 + r * 11}" width="10" height="6" fill="#fff6c9"/>`; }
  if (b.overdue) s += `<rect x="30" y="10" width="100" height="80" fill="url(#hatch)" opacity=".55"/>`;
  return `<svg viewBox="0 0 160 108" width="100%" height="81" preserveAspectRatio="xMidYMax meet"><defs><pattern id="hatch" width="8" height="8"
    patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="8" fill="#b07d2b"/></pattern></defs>${s}</svg>`;
}

function stageCard(b) {
  const st = stageOf(b.floors);
  const pct = st.next ? ((b.floors - STAGES[st.i][0]) / (st.next[0] - STAGES[st.i][0])) * 100 : 100;
  const sub = [st.next ? `${fa(st.next[0] - b.floors)} ✅ تا «${st.next[1]}»` : "به بالاترین مرحله رسیده 🏆",
    `${fa(b.open)} کار باز`];
  if (b.overdue) sub.push(`🚧 ${fa(b.overdue)} کار عقب‌افتاده`);
  return `<div class="stage"><div class="art">${stageArt(b)}</div><div class="info">
    <div class="lvl">${st.name}، ${floors(b.floors)}</div><div class="bar"><i style="width:${pct}%"></i></div>
    <div class="sub">${sub.join("<br>")}</div></div></div>`;
}

function card(t, opts = {}) {
  const b = bmap()[t.building];
  const meta = [];
  if (!opts.noBuilding) meta.push(b.emoji + " " + esc(b.name));
  if (t.overdue) meta.push("⏰ عقب‌افتاده");
  else if (t.due_date && t.due_date !== S.date) meta.push("📅 " + fa(t.due_date.slice(5)));
  if (t.due_time) meta.push("🕒 " + fa(t.due_time));
  if (t.staff) meta.push("👥 پرسنل");
  if (t.board === "waiting") meta.push("⏳ در انتظار");
  if (t.script) meta.push("📝 سناریو داره");
  return `<div class="card ${t.overdue ? "late" : ""}" data-id="${t.id}">
    <div class="t">${esc(t.title)}</div>
    ${meta.length ? `<div class="meta">${meta.join("<span>•</span>")}</div>` : ""}
    <div class="acts">
      <button class="b main" data-a="done">✅ انجام شد</button>
      <button class="b" data-a="later">⏰ بعداً</button>
      <button class="b" data-a="more">⋯</button>
    </div></div>`;
}

function bindCards(root) {
  root.querySelectorAll(".card").forEach((c) => {
    const id = +c.dataset.id;
    c.querySelectorAll("button").forEach((btn) => btn.onclick = () => cardAction(id, btn.dataset.a));
  });
}

function drawToday() {
  const items = S.today;
  $("today").innerHTML = `<h2>📌 کارهای امروز (${fa(items.length)})</h2>` +
    (items.length ? items.map((t) => card(t)).join("") : '<div class="empty">امروز کاری نمونده 🎉<br>یه ساختمون رو توی شهر انتخاب کن و قدم بعدیش رو بردار.</div>') +
    `<div class="legend">${fa(esc(S.streak_line))}${S.buffer_line ? "<br>" + fa(esc(S.buffer_line)) : ""}</div>`;
  bindCards($("today"));
}

function openBuilding(key) {
  const b = bmap()[key];
  sheet(`<h3>${b.emoji} ${esc(b.name)}</h3>` + stageCard(b) +
    (b.tasks.length ? b.tasks.map((t) => card(t, { noBuilding: true })).join("")
      : '<div class="empty">این ساختمون فعلاً کار بازی نداره.</div>') +
    `<button class="b wide" id="add-here">➕ کار جدید برای ${esc(b.name)}</button>`);
  bindCards($("sheet"));
  $("add-here").onclick = () => { closeSheet(); pick.building = key; drawChips(); show("add"); $("text").focus(); };
}

function sheet(html) { $("sheet").innerHTML = html; $("sheet").classList.add("on"); $("sheet-bg").classList.add("on"); }
function closeSheet() { $("sheet").classList.remove("on"); $("sheet-bg").classList.remove("on"); }
$("sheet-bg").onclick = closeSheet;

function choose(title, options, done) {
  sheet(`<h3>${title}</h3><div class="chips">` +
    options.map(([v, l]) => `<button class="chip" data-v="${v}">${l}</button>`).join("") + "</div>");
  $("sheet").querySelectorAll(".chip").forEach((c) => c.onclick = () => { closeSheet(); done(c.dataset.v); });
}

async function act(id, action, body) {
  try {
    const r = await api(`/api/task/${id}/${action}`, body || {});
    if (action === "done" && tg) tg.HapticFeedback.notificationOccurred("success");
    toast(r.message); closeSheet(); await load();
  } catch (e) { toast("نشد، دوباره امتحان کن."); }
}

function cardAction(id, a) {
  if (a === "done") return act(id, "done");
  if (a === "later") return choose("کی دوباره بپرسم؟",
    [["30", "۳۰ دقیقه"], ["60", "یه ساعت"], ["tonight", "امشب"], ["tomorrow", "فردا"]],
    (v) => act(id, "snooze", { option: v }));
  choose("این کار رو چی کنیم؟",
    [["staff", "👥 بده به پرسنل"], ["stuck", "🧱 گیر کردم"], ["move", "🏷 تغییر ساختمون"], ["drop", "🗑 حذف"]],
    (v) => {
      if (v === "move") return choose("کدوم ساختمون؟", S.buildings.map((b) => [b.key, b.emoji + " " + b.name]),
        (k) => act(id, "building", { building: k }));
      if (v === "drop" && !confirm("این کار حذف بشه؟")) return;
      act(id, v);
    });
}

function drawChips() {
  $("b-chips").innerHTML = [["", "✨ خودکار"], ...S.buildings.map((b) => [b.key, b.emoji + " " + b.name])]
    .map(([k, l]) => `<button class="chip ${pick.building === k ? "on" : ""}" data-k="${k}">${esc(l)}</button>`).join("");
  $("w-chips").innerHTML = WHEN
    .map(([k, l]) => `<button class="chip ${pick.when === k ? "on" : ""}" data-k="${k}">${l}</button>`).join("");
  $("b-chips").querySelectorAll(".chip").forEach((c) => c.onclick = () => { pick.building = c.dataset.k; drawChips(); });
  $("w-chips").querySelectorAll(".chip").forEach((c) => c.onclick = () => { pick.when = c.dataset.k; drawChips(); });
}

$("save").onclick = async () => {
  const text = $("text").value.trim();
  if (!text) return toast("اول بنویس چه کاری.");
  try {
    const r = await api("/api/task", { text, building: pick.building || null, when: pick.when || null });
    toast(r.message); $("text").value = ""; pick = { building: "", when: "" };
    await load(); show("today");
  } catch (e) { toast("ثبت نشد، دوباره امتحان کن."); }
};

function show(v) {
  document.querySelectorAll(".view").forEach((s) => s.classList.toggle("on", s.id === "v-" + v));
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.v === v));
  window.scrollTo(0, 0);
}
document.querySelectorAll("nav button").forEach((b) => b.onclick = () => show(b.dataset.v));

load();
</script>
</body>
</html>
